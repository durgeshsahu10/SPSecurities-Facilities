# Firebase App Hosting backend configuration (tracked in git).
#
# This file intentionally contains NO secret or API-key values. GitHub's
# secret scanner flags committed keys, so all real values live in the
# backend's environment settings instead:
#   Firebase console → Build → App Hosting → spsecurities-webapp →
#   Settings → Environment variables (availability: Build and runtime)
#     VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#     VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
#     VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
#   plus runtime-only: ADMIN_EMAIL, SMTP_HOST, SMTP_PORT, SMTP_USER,
#   and the SMTP_PASS secret (firebase apphosting:secrets:set SMTP_PASS).
#
# Only NITRO_PRESET stays here: it is not sensitive, and the cloud build
# needs it to emit a plain Node server (.output/server/index.mjs).
runConfig:
  environmentVariables:
    - variable: NITRO_PRESET
      value: node-server
      availability: BUILD
