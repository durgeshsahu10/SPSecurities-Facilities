# Firebase App Hosting backend configuration (tracked in git).
#
# - VITE_* values are publishable web keys (they ship inside the public JS
#   bundle anyway) and MUST be present at BUILD time — Vite bakes them in.
# - ADMIN_EMAIL / SMTP_* are RUNTIME-only (the Node server reads them to send
#   admin notification emails). SMTP_PASS stays a Secret Manager secret and is
#   created with:  firebase apphosting:secrets:set SMTP_PASS
# - NITRO_PRESET=node-server makes the build emit a plain Node server
#   (.output/server/index.mjs) that App Hosting can run.
runConfig:
  environmentVariables:
    - variable: NITRO_PRESET
      value: node-server
      availability: BUILD
    - variable: VITE_FIREBASE_API_KEY
      value: AIzaSyA8aYAGyIPsh72870G6cyn2-aBK8dRH9a0
      availability: BUILD_AND_RUNTIME
    - variable: VITE_FIREBASE_AUTH_DOMAIN
      value: spsecurities-2a6b0.firebaseapp.com
      availability: BUILD_AND_RUNTIME
    - variable: VITE_FIREBASE_PROJECT_ID
      value: spsecurities-2a6b0
      availability: BUILD_AND_RUNTIME
    - variable: VITE_FIREBASE_STORAGE_BUCKET
      value: spsecurities-2a6b0.firebasestorage.app
      availability: BUILD_AND_RUNTIME
    - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
      value: "890290149550"
      availability: BUILD_AND_RUNTIME
    - variable: VITE_FIREBASE_APP_ID
      value: 1:890290149550:web:b6c5a30d78ec016853f53f
      availability: BUILD_AND_RUNTIME
    - variable: ADMIN_EMAIL
      value: Monikak@spgroupcorps.com
      availability: RUNTIME
    - variable: SMTP_HOST
      value: smtp.gmail.com
      availability: RUNTIME
    - variable: SMTP_PORT
      value: "587"
      availability: RUNTIME
    - variable: SMTP_USER
      value: ""
      availability: RUNTIME
    - variable: SMTP_PASS
      secret: SMTP_PASS
      availability: RUNTIME
